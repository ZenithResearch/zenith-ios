<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenith iOS flow prototype</title>
<style>:root{color-scheme:light dark;--bg:light-dark(#f5faf8,#131a18);--ink:light-dark(#193830,#d1faf0);--surface:light-dark(#ffffff,#202b27);--accent:light-dark(#185647,#9bfbe3)}*{box-sizing:border-box}body{margin:0;font:17px system-ui;background:var(--bg);color:var(--ink)}main{max-width:410px;min-height:650px;margin:32px auto;background:var(--surface);padding:28px;display:flex;flex-direction:column;gap:20px;border-radius:28px}header{display:flex;justify-content:space-between;align-items:center}small{opacity:.7}h1{font-size:32px;font-weight:650;letter-spacing:-1px;margin:14px 0}p{line-height:1.5}button{font:inherit;min-height:48px;border:0;border-radius:12px;background:transparent;color:inherit;padding:12px;text-align:left;cursor:pointer}button.primary{background:var(--accent);color:var(--bg);text-align:center;font-weight:600;width:100%}section{flex:1}footer{display:flex;gap:8px;border-top:1px solid color-mix(in srgb,var(--ink) 15%,transparent);padding-top:12px}footer button{flex:1;text-align:center}.row{border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding:16px 0;display:block;width:100%}.status{font-size:14px;opacity:.75;display:block;margin-top:6px}input{font:inherit;padding:14px;border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);border-radius:10px;width:100%;background:var(--bg);color:inherit}a{color:inherit}.note{max-width:410px;margin:20px auto;font-size:14px}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:460px){main{margin:0;min-height:95vh;border-radius:0}}</style>
<p class="note">Flow prototype · fictional data · no keys, storage or network</p><main><header><button id="back">Back</button><small>Zenith</small><button id="cancel">Cancel</button></header><section id="screen" aria-live="polite"></section><footer id="tabs" hidden><button data-to="work">Work</button><button data-to="wallet">Wallet</button></footer></main>
<script>
const screens={
welcome:['Your Zenith wallet','Keep your membership and read your work in one place.','Create a wallet','password','Restore a wallet','restore'],
password:['Choose your password','You will use this password to unlock your wallet. Use at least 12 characters.','Create wallet','save'],
save:['Save your recovery file','Keep this encrypted file somewhere you can find it. You need its password to recover your wallet.','Save recovery file','check'],
check:['Check your saved file','Choose the file you just saved and enter its recovery password. This makes sure it works.','Choose saved file','verified'],
verified:['Recovery checked','Your saved file restores this wallet.','Join Zenith','membership'],
restore:['Restore your wallet','Choose your recovery file. You can add a data file next.','Choose recovery file','restoreUnlock'],
restoreUnlock:['Unlock recovery file','Enter the password you used when you saved this file.','Unlock file','restorePassword'],
restorePassword:['Choose a wallet password','This password unlocks the wallet on this phone. Your original file stays unchanged.','Continue','review'],
review:['Restore this wallet?','Member Key: 8c31…d724<br>Profile: Alex<br>Membership proof: 1<br><br>Restoring does not activate membership or work access.','Restore wallet','restored'],
restored:['Wallet restored','Your recovery file has been checked.','Review membership','membership'],
membership:['Join Zenith','Provider: Zenith Research<br><br>This creates your membership. Work access is a separate step.','Join Zenith','access'],
access:['Connect your work','Read only<br>Permitted work: Zenith<br>Server: work.example.test<br>Expires: in 30 days<br><br>You can read this work. You cannot change it.','Connect work','work'],
expired:['Your access expired','Reconnect to request fresh read-only access.','Reconnect','access'],
error:['Could not save','Your wallet is unchanged. You can choose a different destination.','Choose destination','save'],
wallet:['Wallet','',null,null],work:['Work','',null,null],detail:['Native Wallet recovery','Task · In progress<br>Project: Zenith iOS<br><br>Make recovering the same identity simple, safe and understandable.',null,null]
};let state='welcome',history=[];
function render(){const [title,body,action,next,secondary,other]=screens[state];document.getElementById('screen').innerHTML='<h1>'+title+'</h1><p>'+body+'</p>'+(action?'<button class="primary" data-to="'+next+'">'+action+'</button>':'')+(secondary?'<button class="row" data-to="'+other+'">'+secondary+'</button>':'');const view=document.getElementById('screen');if(state==='work')view.innerHTML+='<input aria-label="Search work" placeholder="Search work"><button class="row" data-to="detail">Native Wallet recovery<span class="status">Task · In progress</span></button><button class="row" data-to="detail">Simple work reader<span class="status">Issue · Not started</span></button>';if(state==='wallet')view.innerHTML+='<button class="row" data-to="membership">Membership<span class="status">Active</span></button><button class="row" data-to="save">Recovery<span class="status">Checked</span></button><button class="row" data-to="access">Work access<span class="status">Read only</span></button>';document.getElementById('tabs').hidden=!['work','wallet','detail','expired'].includes(state);document.getElementById('back').disabled=!history.length;document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>go(b.dataset.to))}
function go(to){history.push(state);state=to;render()}document.getElementById('back').onclick=()=>{state=history.pop()||'welcome';render()};document.getElementById('cancel').onclick=()=>{history=[];state='welcome';render()};render();
</script></html>
