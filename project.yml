name: Zenith
options:
  bundleIdPrefix: ca.zenith.preview
  deploymentTarget:
    iOS: '18.1'
packages:
  ZenithKit:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.9'
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Zenith:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: Dictate a Chat message using your iPhone microphone. Review the text before sending.
        NSSpeechRecognitionUsageDescription: Turn your spoken words into editable Chat text using on-device speech recognition.
        NSFaceIDUsageDescription: Unlock your Zenith wallet using Face ID instead of typing its password.
        NSLocalNetworkUsageDescription: Connect to your chosen work server on the same Wi-Fi network.
        NSCameraUsageDescription: Scan an encrypted recovery file from your laptop screen to import your wallet offline.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ca.castalia.recovery
            UTTypeDescription: Encrypted Castalia recovery file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [castalia-recovery]
    sources:
      - path: App
        excludes: [WorkAccess.json, Membership.json]
    dependencies:
      - package: ZenithKit
      - package: ZenithKit
        product: CastaliaCustody
      - framework: Artifacts/TailscaleKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.zenith.preview.wallet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zenith
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '44'
schemes:
  Zenith:
    build:
      targets:
        Zenith: all
